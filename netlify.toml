[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# Short address for Meta: https://YOUR-SITE.netlify.app/webhook
[[redirects]]
  from = "/webhook"
  to = "/.netlify/functions/webhook"
  status = 200
